name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Without a token the server must still start, list every tool, and answer
      # each call with how to get a token — not a stack trace, not a network call.
      - name: Smoke run without a token
        run: node scripts/smoke.mjs

  docker:
    # Glama builds this image to read the tool list; keep it building.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: docker build -t somiya-mcp .
      - name: Tool list from the image, without a token
        run: |
          # stdin stays open a few seconds so the answers are written before EOF.
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'; sleep 5; } \
            | timeout 20 docker run -i --rm somiya-mcp > out.jsonl || true
          cat out.jsonl
          grep '"id":2' out.jsonl | grep -q '"somiya_whats_next"'
