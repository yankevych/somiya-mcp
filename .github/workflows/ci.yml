name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Without a token the server must exit with a readable message, not a stack trace.
      - name: Smoke run without a token
        run: |
          set +e
          out=$(node dist/index.js 2>&1 < /dev/null); code=$?
          echo "$out"
          [ "$code" -ne 0 ] && echo "$out" | grep -q "SOMIYA_TOKEN is not set"
